# null may already exist; therefore ownership has to be changed with command
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444
grsec		root:root 660

kmem		root:root 640
mem		root:root 640
port		root:root 640
# console may already exist; therefore ownership has to be changed with command
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660

# Typical devices
tty		root:tty 666
tty[0-9]*	root:tty 660
vcsa*[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# block devices
ram([0-9]*)	root:disk 660 >rd/%1
loop([0-9]+)	root:disk 660 >loop/%1
sr[0-9]*	root:cdrom 660 @ln -sf $MDEV cdrom
fd[0-9]*	root:floppy 660
SUBSYSTEM=block;.* root:disk 660 */etc/mdev.d/block-device

# alsa sound devices
snd/pcm.*	root:audio 660
snd/control.*	root:audio 660
snd/midi.*	root:audio 660
snd/seq		root:audio 660
snd/timer	root:audio 660

# input stuff
input/event[0-9]+	root:root 640
input/mice		root:root 640
input/mouse[0-9]	root:root 640
input/ts[0-9]		root:root 600

# load modules
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"

# Catch all unknow events for debuging.
.* root:root 660 */etc/mdev.d/catch-all
